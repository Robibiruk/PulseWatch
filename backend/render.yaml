services:
  - type: web
    name: pulsewatch-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      # The GitHub Actions cron owns the monitoring loop. Running the in-process
      # scheduler here too would poll the DB every POLL_INTERVAL (15s), which
      # keeps the Neon compute permanently awake and burns the free-tier
      # CU-hour quota. Let the compute scale to zero between cron ticks.
      - key: NO_WORKER
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false
      - key: ALERT_TO_EMAIL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-oss-20b:free
