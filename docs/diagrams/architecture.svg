<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="500" fill="url(#bg)"/>

  <!-- Title -->
  <text
    x="600"
    y="32"
    fill="#555"
    font-family="'JetBrains Mono', monospace"
    font-size="11"
    text-anchor="middle"
    letter-spacing="3"
  >
    PULSEWATCH PRODUCTION ARCHITECTURE
  </text>

  <!-- Vercel Frontend -->
  <rect x="40" y="190" width="190" height="90" rx="14"
        fill="#0e0e0e" stroke="#61dafb" stroke-opacity="0.5"/>

  <text x="135" y="222"
        fill="#61dafb"
        font-family="system-ui"
        font-size="15"
        font-weight="700"
        text-anchor="middle">
    Vercel
  </text>

  <text x="135" y="245"
        fill="#aaa"
        font-family="system-ui"
        font-size="11"
        text-anchor="middle">
    React + Vite + TypeScript
  </text>

  <text x="135" y="264"
        fill="#666"
        font-family="system-ui"
        font-size="10"
        text-anchor="middle">
    Frontend / Dashboard
  </text>

  <!-- Frontend -> Azure -->
  <line x1="230" y1="235" x2="315" y2="235"
        stroke="#34d399"
        stroke-width="2"
        stroke-dasharray="7 5"/>

  <polygon points="315,230 330,235 315,240"
           fill="#34d399"/>

  <text x="272" y="225"
        fill="#888"
        font-family="system-ui"
        font-size="9"
        text-anchor="middle">
    REST + JWT
  </text>

  <!-- Azure VM boundary -->
  <rect x="330" y="75" width="500" height="330" rx="20"
        fill="#07111b"
        stroke="#0078d4"
        stroke-width="2"
        stroke-opacity="0.55"/>

  <text x="580" y="105"
        fill="#0078d4"
        font-family="system-ui"
        font-size="16"
        font-weight="700"
        text-anchor="middle">
    Azure Linux VM
  </text>

  <text x="580" y="125"
        fill="#777"
        font-family="system-ui"
        font-size="10"
        text-anchor="middle">
    Persistent self-hosted production environment
  </text>

  <!-- FastAPI -->
  <rect x="365" y="155" width="190" height="95" rx="12"
        fill="#0e0e0e"
        stroke="#22d3ee"
        stroke-opacity="0.55"/>

  <text x="460" y="185"
        fill="#22d3ee"
        font-family="system-ui"
        font-size="14"
        font-weight="700"
        text-anchor="middle">
    FastAPI
  </text>

  <text x="460" y="207"
        fill="#aaa"
        font-family="system-ui"
        font-size="11"
        text-anchor="middle">
    REST API + Auth
  </text>

  <text x="460" y="226"
        fill="#666"
        font-family="system-ui"
        font-size="10"
        text-anchor="middle">
    Status Pages + API
  </text>

  <!-- Worker -->
  <rect x="605" y="155" width="190" height="95" rx="12"
        fill="#0e0e0e"
        stroke="#f87171"
        stroke-opacity="0.55"/>

  <text x="700" y="185"
        fill="#f87171"
        font-family="system-ui"
        font-size="14"
        font-weight="700"
        text-anchor="middle">
    Monitoring Worker
  </text>

  <text x="700" y="207"
        fill="#aaa"
        font-family="system-ui"
        font-size="11"
        text-anchor="middle">
    Scheduler + HTTP Probes
  </text>

  <text x="700" y="226"
        fill="#666"
        font-family="system-ui"
        font-size="10"
        text-anchor="middle">
    Incidents + Alerts
  </text>

  <!-- FastAPI -> Worker -->
  <line x1="555" y1="202" x2="605" y2="202"
        stroke="#f87171"
        stroke-width="1.5"
        stroke-dasharray="5 4"/>

  <!-- PostgreSQL -->
  <rect x="365" y="300" width="190" height="75" rx="12"
        fill="#0e0e0e"
        stroke="#4169e1"
        stroke-opacity="0.65"/>

  <text x="460" y="328"
        fill="#6f8cff"
        font-family="system-ui"
        font-size="14"
        font-weight="700"
        text-anchor="middle">
    PostgreSQL
  </text>

  <text x="460" y="349"
        fill="#aaa"
        font-family="system-ui"
        font-size="11"
        text-anchor="middle">
    Self-hosted database
  </text>

  <text x="460" y="365"
        fill="#666"
        font-family="system-ui"
        font-size="9"
        text-anchor="middle">
    Fresh production data
  </text>

  <!-- API -> DB -->
  <line x1="460" y1="250" x2="460" y2="300"
        stroke="#6f8cff"
        stroke-width="1.5"
        stroke-dasharray="5 4"/>

  <!-- Worker -> DB -->
  <line x1="700" y1="250" x2="555" y2="330"
        stroke="#6f8cff"
        stroke-width="1.5"
        stroke-dasharray="5 4"/>

  <!-- Telegram -->
  <rect x="875" y="95" width="180" height="75" rx="12"
        fill="#0e0e0e"
        stroke="#0088cc"
        stroke-opacity="0.55"/>

  <text x="965" y="124"
        fill="#0088cc"
        font-family="system-ui"
        font-size="14"
        font-weight="700"
        text-anchor="middle">
    Telegram Bot
  </text>

  <text x="965" y="146"
        fill="#aaa"
        font-family="system-ui"
        font-size="11"
        text-anchor="middle">
    Long-polling
  </text>

  <text x="965" y="161"
        fill="#666"
        font-family="system-ui"
        font-size="9"
        text-anchor="middle">
    Commands + alerts
  </text>

  <!-- Worker -> Telegram -->
  <path d="M795 180 C835 150 845 135 875 135"
        stroke="#0088cc"
        stroke-width="1.5"
        stroke-dasharray="5 4"
        fill="none"/>

  <!-- OpenRouter -->
  <rect x="875" y="215" width="180" height="75" rx="12"
        fill="#0e0e0e"
        stroke="#a78bfa"
        stroke-opacity="0.6"/>

  <text x="965" y="244"
        fill="#a78bfa"
        font-family="system-ui"
        font-size="14"
        font-weight="700"
        text-anchor="middle">
    OpenRouter
  </text>

  <text x="965" y="266"
        fill="#aaa"
        font-family="system-ui"
        font-size="11"
        text-anchor="middle">
    GPT-OSS-20B
  </text>

  <text x="965" y="281"
        fill="#666"
        font-family="system-ui"
        font-size="9"
        text-anchor="middle">
    AI incident analysis
  </text>

  <!-- Worker -> AI -->
  <path d="M795 215 C835 235 845 250 875 250"
        stroke="#a78bfa"
        stroke-width="1.5"
        stroke-dasharray="5 4"
        fill="none"/>

  <!-- Alerts -->
  <rect x="875" y="335" width="180" height="75" rx="12"
        fill="#0e0e0e"
        stroke="#34d399"
        stroke-opacity="0.5"/>

  <text x="965" y="364"
        fill="#34d399"
        font-family="system-ui"
        font-size="14"
        font-weight="700"
        text-anchor="middle">
    Notifications
  </text>

  <text x="965" y="386"
        fill="#aaa"
        font-family="system-ui"
        font-size="11"
        text-anchor="middle">
    Email / Discord / Slack
  </text>

  <text x="965" y="401"
        fill="#666"
        font-family="system-ui"
        font-size="9"
        text-anchor="middle">
    Generic webhooks
  </text>

  <!-- Worker -> Notifications -->
  <path d="M795 235 C840 310 845 370 875 370"
        stroke="#34d399"
        stroke-width="1.5"
        stroke-dasharray="5 4"
        fill="none"/>

  <!-- Monitoring targets -->
  <rect x="40" y="345" width="190" height="75" rx="12"
        fill="#0e0e0e"
        stroke="#f59e0b"
        stroke-opacity="0.5"/>

  <text x="135" y="374"
        fill="#f59e0b"
        font-family="system-ui"
        font-size="14"
        font-weight="700"
        text-anchor="middle">
    Monitored Services
  </text>

  <text x="135" y="396"
        fill="#aaa"
        font-family="system-ui"
        font-size="11"
        text-anchor="middle">
    HTTP / HTTPS / Heartbeat
  </text>

  <!-- Targets -> Worker -->
  <path d="M230 380 C300 380 300 235 365 235"
        stroke="#f59e0b"
        stroke-width="1.5"
        stroke-dasharray="5 4"
        fill="none"/>

</svg>
