<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1000" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="400" fill="url(#bg2)"/>

  <!-- React SPA -->
  <rect x="40" y="140" width="160" height="80" rx="12" fill="#0e0e0e" stroke="#61dafb" stroke-opacity="0.4"/>
  <text x="120" y="172" fill="#61dafb" font-family="system-ui" font-size="13" font-weight="600" text-anchor="middle">React SPA</text>
  <text x="120" y="192" fill="#888" font-family="system-ui" font-size="11" text-anchor="middle">Vite + TypeScript</text>

  <!-- Arrows: SPA -> API -->
  <line x1="200" y1="180" x2="270" y2="180" stroke="#34d399" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="270,175 285,180 270,185" fill="#34d399"/>
  <text x="235" y="172" fill="#888" font-family="system-ui" font-size="9" text-anchor="middle">REST + JWT</text>

  <!-- FastAPI -->
  <rect x="280" y="120" width="180" height="120" rx="12" fill="#0e0e0e" stroke="#22d3ee" stroke-opacity="0.5"/>
  <text x="370" y="158" fill="#22d3ee" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">FastAPI</text>
  <text x="370" y="180" fill="#888" font-family="system-ui" font-size="11" text-anchor="middle">main:app</text>
  <text x="370" y="200" fill="#666" font-family="system-ui" font-size="10" text-anchor="middle">API + CORS + Auth</text>
  <text x="370" y="220" fill="#666" font-family="system-ui" font-size="10" text-anchor="middle">Status Pages</text>

  <!-- Worker -->
  <rect x="530" y="60" width="160" height="80" rx="12" fill="#0e0e0e" stroke="#f87171" stroke-opacity="0.4"/>
  <text x="610" y="92" fill="#f87171" font-family="system-ui" font-size="13" font-weight="600" text-anchor="middle">Worker</text>
  <text x="610" y="112" fill="#888" font-family="system-ui" font-size="11" text-anchor="middle">Scheduler + Probes</text>

  <!-- Arrow: API -> Worker (lifespan) -->
  <path d="M370 120 C370 80 530 100 530 90" stroke="#f87171" stroke-width="1.5" stroke-dasharray="5 3" fill="none"/>
  <text x="450" y="82" fill="#888" font-family="system-ui" font-size="9" text-anchor="middle">lifespan</text>

  <!-- Telegram Bot -->
  <rect x="530" y="220" width="160" height="80" rx="12" fill="#0e0e0e" stroke="#0088cc" stroke-opacity="0.4"/>
  <text x="610" y="252" fill="#0088cc" font-family="system-ui" font-size="13" font-weight="600" text-anchor="middle">Telegram Bot</text>
  <text x="610" y="272" fill="#888" font-family="system-ui" font-size="11" text-anchor="middle">Long-polling</text>

  <!-- Arrow: API -> Bot (lifespan) -->
  <path d="M370 240 C370 280 530 260 530 260" stroke="#0088cc" stroke-width="1.5" stroke-dasharray="5 3" fill="none"/>

  <!-- DB -->
  <rect x="780" y="140" width="160" height="80" rx="12" fill="#0e0e0e" stroke="#a78bfa" stroke-opacity="0.4"/>
  <text x="860" y="168" fill="#a78bfa" font-family="system-ui" font-size="13" font-weight="600" text-anchor="middle">Neon Postgres</text>
  <text x="860" y="190" fill="#888" font-family="system-ui" font-size="11" text-anchor="middle">Shared database</text>

  <!-- Arrow: API -> DB -->
  <line x1="460" y1="180" x2="780" y2="180" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="780,175 795,180 780,185" fill="#a78bfa"/>

  <!-- Arrow: Worker -> DB -->
  <path d="M610 140 C610 160 780 170 780 175" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5 3" fill="none"/>
  <text x="700" y="152" fill="#888" font-family="system-ui" font-size="9" text-anchor="middle">SKIP LOCKED</text>

  <!-- Notifications -->
  <rect x="700" y="260" width="140" height="60" rx="10" fill="#0e0e0e" stroke="#34d399" stroke-opacity="0.3"/>
  <text x="770" y="286" fill="#34d399" font-family="system-ui" font-size="12" font-weight="600" text-anchor="middle">Alerts</text>
  <text x="770" y="302" fill="#888" font-family="system-ui" font-size="10" text-anchor="middle">TG / Email / Webhook</text>

  <!-- Arrow: Worker -> Alerts -->
  <path d="M610 140 C680 180 740 260 740 260" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5 3" fill="none"/>

  <!-- Labels -->
  <text x="500" y="24" fill="#555" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle" letter-spacing="3">PULSEWATCH ARCHITECTURE</text>
</svg>
