<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="glow" x1="350" y1="180" x2="850" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="card"><rect width="480" height="300" rx="16"/></clipPath>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <circle cx="500" cy="300" r="200" fill="url(#glow)" filter="url(#blur1)"/>
  <circle cx="760" cy="300" r="180" fill="#34d399" fill-opacity="0.04" filter="url(#blur1)"/>

  <!-- Title -->
  <text x="60" y="92" fill="#fafafa" font-family="system-ui" font-size="48" font-weight="800" letter-spacing="-1.5">PulseWatch</text>
  <text x="60" y="128" fill="#888" font-family="system-ui" font-size="15">Self-hosted uptime monitoring with Telegram alerts,</text>
  <text x="60" y="151" fill="#888" font-family="system-ui" font-size="15">AI-explained incidents, and public status pages.</text>

  <!-- Azure VM -->
  <rect x="60" y="195" width="270" height="150" rx="14" fill="#0e0e0e" stroke="#0078D4" stroke-opacity="0.65"/>
  <text x="195" y="226" fill="#4db8ff" font-family="system-ui" font-size="15" font-weight="700" text-anchor="middle">Azure Virtual Machine</text>
  <text x="195" y="250" fill="#888" font-family="system-ui" font-size="11" text-anchor="middle">Always-on production VPS</text>
  <rect x="88" y="270" width="214" height="28" rx="7" fill="#0078D4" fill-opacity="0.10" stroke="#0078D4" stroke-opacity="0.25"/>
  <text x="195" y="289" fill="#79c9ff" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle">FastAPI • Worker • Telegram Bot</text>
  <text x="195" y="319" fill="#666" font-family="system-ui" font-size="10" text-anchor="middle">Ubuntu 24.04 LTS</text>

  <!-- React SPA -->
  <rect x="60" y="390" width="270" height="80" rx="12" fill="#0e0e0e" stroke="#61dafb" stroke-opacity="0.4"/>
  <text x="195" y="421" fill="#61dafb" font-family="system-ui" font-size="14" font-weight="600" text-anchor="middle">React SPA</text>
  <text x="195" y="443" fill="#888" font-family="system-ui" font-size="11" text-anchor="middle">Vite + TypeScript • Vercel</text>

  <!-- Connection SPA -> Azure -->
  <path d="M195 390 C195 370 195 360 195 345" stroke="#34d399" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="190,350 195,340 200,350" fill="#34d399"/>
  <text x="218" y="370" fill="#888" font-family="system-ui" font-size="9">REST + JWT</text>

  <!-- Dashboard card -->
  <g transform="translate(620, 55)" clip-path="url(#card)">
    <rect width="480" height="300" fill="#0e0e0e" rx="16"/>
    <rect width="480" height="48" fill="#141313"/>
    <text x="20" y="30" fill="#fafafa" font-family="system-ui" font-size="14" font-weight="600">PulseWatch Dashboard</text>
    <g transform="translate(20, 68)">
      <rect width="220" height="90" rx="12" fill="#0a0a0a" stroke="rgba(255,255,255,0.08)"/>
      <text x="16" y="28" fill="#888" font-family="system-ui" font-size="11">TOTAL MONITORS</text>
      <text x="16" y="62" fill="#fafafa" font-family="'JetBrains Mono',monospace" font-size="28" font-weight="700">12</text>
      <text x="16" y="80" fill="#888" font-family="system-ui" font-size="11">2 paused</text>
    </g>
    <g transform="translate(248, 68)">
      <rect width="220" height="90" rx="12" fill="#0a0a0a" stroke="rgba(255,255,255,0.08)"/>
      <text x="16" y="28" fill="#888" font-family="system-ui" font-size="11">UPTIME 24H</text>
      <text x="16" y="62" fill="#34d399" font-family="'JetBrains Mono',monospace" font-size="28" font-weight="700">99.97%</text>
      <text x="16" y="80" fill="#888" font-family="system-ui" font-size="11">Across all services</text>
    </g>
    <g transform="translate(20, 178)">
      <rect width="440" height="100" rx="12" fill="#0a0a0a" stroke="rgba(255,255,255,0.08)"/>
      <text x="16" y="24" fill="#fafafa" font-family="system-ui" font-size="12" font-weight="600">Monitored services</text>
      <rect x="16" y="38" width="408" height="1" fill="rgba(255,255,255,0.06)"/>
      <circle cx="32" cy="58" r="4" fill="#34d399"/>
      <text x="44" y="62" fill="#fafafa" font-family="system-ui" font-size="12">api.example.com</text>
      <text x="320" y="62" fill="#34d399" font-family="system-ui" font-size="12">Operational</text>
      <text x="410" y="62" fill="#888" font-family="'JetBrains Mono',monospace" font-size="11">142ms</text>
      <circle cx="32" cy="84" r="4" fill="#f87171"/>
      <text x="44" y="88" fill="#fafafa" font-family="system-ui" font-size="12">status.example.com</text>
      <text x="310" y="88" fill="#f87171" font-family="system-ui" font-size="12">Down</text>
      <text x="400" y="88" fill="#888" font-family="'JetBrains Mono',monospace" font-size="11">HTTP 503</text>
    </g>
  </g>

  <!-- Production flow labels -->
  <text x="450" y="195" fill="#555" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle" letter-spacing="2">ALWAYS-ON MONITORING</text>

  <rect x="390" y="220" width="180" height="62" rx="11" fill="#0e0e0e" stroke="#f87171" stroke-opacity="0.4"/>
  <text x="480" y="246" fill="#f87171" font-family="system-ui" font-size="12" font-weight="600" text-anchor="middle">Monitoring Worker</text>
  <text x="480" y="265" fill="#888" font-family="system-ui" font-size="10" text-anchor="middle">Scheduled probes</text>

  <rect x="390" y="305" width="180" height="62" rx="11" fill="#0e0e0e" stroke="#0088cc" stroke-opacity="0.45"/>
  <text x="480" y="331" fill="#0088cc" font-family="system-ui" font-size="12" font-weight="600" text-anchor="middle">Telegram Bot</text>
  <text x="480" y="350" fill="#888" font-family="system-ui" font-size="10" text-anchor="middle">Long-polling alerts</text>

  <!-- Azure -> internal services -->
  <line x1="330" y1="270" x2="390" y2="250" stroke="#f87171" stroke-width="1.5" stroke-dasharray="5 3"/>
  <line x1="330" y1="310" x2="390" y2="335" stroke="#0088cc" stroke-width="1.5" stroke-dasharray="5 3"/>

  <!-- Database -->
  <rect x="390" y="405" width="180" height="62" rx="11" fill="#0e0e0e" stroke="#a78bfa" stroke-opacity="0.5"/>
  <text x="480" y="431" fill="#a78bfa" font-family="system-ui" font-size="12" font-weight="600" text-anchor="middle">PostgreSQL</text>
  <text x="480" y="450" fill="#888" font-family="system-ui" font-size="10" text-anchor="middle">Application database</text>

  <line x1="480" y1="367" x2="480" y2="405" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="505" y="390" fill="#666" font-family="system-ui" font-size="9">async SQLAlchemy</text>

  <!-- Alerts -->
  <rect x="620" y="405" width="220" height="62" rx="11" fill="#0e0e0e" stroke="#34d399" stroke-opacity="0.4"/>
  <text x="730" y="431" fill="#34d399" font-family="system-ui" font-size="12" font-weight="600" text-anchor="middle">Notifications</text>
  <text x="730" y="450" fill="#888" font-family="system-ui" font-size="10" text-anchor="middle">Telegram • Email • Discord • Slack</text>

  <path d="M570 250 C620 280 670 380 700 405" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5 3" fill="none"/>

  <!-- Bottom badges -->
  <g transform="translate(60, 520)">
    <rect width="92" height="25" rx="6" fill="#0078D4" fill-opacity="0.14" stroke="#0078D4" stroke-opacity="0.35"/>
    <text x="46" y="17" fill="#79c9ff" font-family="system-ui" font-size="10" font-weight="600" text-anchor="middle">Azure VM</text>
    <rect x="104" width="78" height="25" rx="6" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.3"/>
    <text x="143" y="17" fill="#22d3ee" font-family="system-ui" font-size="10" font-weight="600" text-anchor="middle">FastAPI</text>
    <rect x="194" width="70" height="25" rx="6" fill="#61dafb" fill-opacity="0.12" stroke="#61dafb" stroke-opacity="0.3"/>
    <text x="229" y="17" fill="#61dafb" font-family="system-ui" font-size="10" font-weight="600" text-anchor="middle">React</text>
    <rect x="276" width="96" height="25" rx="6" fill="#41b883" fill-opacity="0.12" stroke="#41b883" stroke-opacity="0.3"/>
    <text x="324" y="17" fill="#41b883" font-family="system-ui" font-size="10" font-weight="600" text-anchor="middle">TypeScript</text>
    <rect x="384" width="94" height="25" rx="6" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.3"/>
    <text x="431" y="17" fill="#c4b5fd" font-family="system-ui" font-size="10" font-weight="600" text-anchor="middle">PostgreSQL</text>
    <rect x="490" width="74" height="25" rx="6" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.3"/>
    <text x="527" y="17" fill="#34d399" font-family="system-ui" font-size="10" font-weight="600" text-anchor="middle">OpenRouter</text>
  </g>

  <text x="900" y="530" fill="#444" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle" letter-spacing="3">PULSEWATCH • SELF-HOSTED</text>
</svg>
