name: PulseWatch Monitor

# The "always-awake" worker — runs on GitHub's free tier (public repo: no
# Actions-minute cost). Each run: connect to Neon, probe all due monitors,
# save checks, fire alerts. No paid server required.
# Note: GitHub's schedule guarantee is ~5 minutes (the shortest reliable
# interval for the schedule event), so this cron is a safety net; the Render
# API's in-process worker covers faster polling while that web service is
# awake. The claim-lock (SELECT ... FOR UPDATE SKIP LOCKED) dedupes the two.
on:
  schedule:
    # UTC cron. GitHub may delay scheduled runs under load.
    - cron: "*/5 * * * *"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run one monitoring tick
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
        run: python backend/worker_runner.py
