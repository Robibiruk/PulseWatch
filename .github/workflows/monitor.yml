name: PulseWatch Monitor

# The "always-awake" worker — runs on GitHub's free tier every minute.
# Each run: connect to Neon, probe all due monitors, save checks, fire alerts.
# No paid server required.
on:
  schedule:
    # Minute granularity (GitHub's finest). UTC cron.
    - cron: "*/1 * * * *"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run one monitoring tick
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          FAILURE_THRESHOLD: ${{ secrets.FAILURE_THRESHOLD }}
          CONFIRMATION_DELAY: ${{ secrets.CONFIRMATION_DELAY }}
        run: python backend/worker_runner.py
